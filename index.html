<style>
:root{
  --cask:#17120e;       /* Fassholz, Hintergrund */
  --cask2:#211a14;      /* Flächen, Dialoge */
  --cask3:#2a2018;      /* Platzhalter */
  --line:#3a2f25;       /* feine Linien */
  --line2:#5a4a3a;      /* Ränder von Feldern und Knöpfen */
  --paper:#efe6d2;      /* Etikett */
  --ink:#1d160f;        /* Schrift auf Etikett */
  --ink2:#5b4a38;
  --mute:#a89a85;
  --copper:#c8813a;     /* Akzent */
  --copper2:#e0a05a;
  --peat:#8a6a43;
  --good:#8fb27a;
  --bad:#d08a74;
  --r:2px;
  --serif:'Newsreader',Georgia,serif;
  --sans:'Hanken Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --stripes:repeating-linear-gradient(135deg,#2a2018 0 8px,#31261c 8px 16px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cask);color:var(--paper);font:400 15px/1.5 var(--sans);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
button,input,select,textarea{font-family:var(--sans);font-size:inherit;color:inherit}
a{color:var(--copper)}a:hover{color:var(--copper2)}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.hwrap{max-width:1120px;margin:0 auto;padding-left:24px;padding-right:24px}
.top{position:sticky;top:0;z-index:5;background:#17120ef2;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:calc(18px + env(safe-area-inset-top))}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.brand>div{display:flex;align-items:baseline;gap:12px;min-width:0}
.top h1{font:500 1.7rem/1 var(--serif);letter-spacing:-.01em;white-space:nowrap}
.kicker{font:400 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#chip{font:400 12px var(--mono);color:var(--mute);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabs{display:flex;gap:28px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;color:var(--mute);cursor:pointer;white-space:nowrap;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;position:relative}
#tabs button:hover{color:var(--paper)}
#tabs button.on{color:var(--copper2);border-color:var(--copper)}
#tabs .dot{position:absolute;top:6px;right:-10px;width:7px;height:7px;border-radius:50%;background:var(--copper)}
main{max-width:1120px;margin:0 auto;padding:28px 24px 96px}
.muted{color:var(--mute)} .sm{font-size:13px}
.err{color:var(--bad)} .ok{color:var(--good)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row.sb{justify-content:space-between}
.ptitle{margin:0 0 20px;font:400 1.8rem var(--serif)}
.lrow{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:hover .lmain b{color:var(--copper2)}
.lmain{min-width:0;display:flex;flex-direction:column;gap:2px}
.lmain b{font:500 1.15rem var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
.lmain span{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font:400 12px var(--mono);color:var(--mute);white-space:nowrap}
.lr b{font:400 1.2rem var(--serif);color:var(--copper2)}
.qr{background:#fff;padding:14px;width:min(100%,280px);margin:0 auto}
.qr svg{width:100%;height:auto;display:block}
.clog{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sub{font:400 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:28px 0 10px}
.bars{display:flex;flex-direction:column}
.bar{display:grid;grid-template-columns:minmax(84px,34%) 1fr auto;gap:12px;align-items:center;padding:5px 0}
.bar .bl{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{height:8px;background:var(--cask3)}
.bar .bt i{display:block;height:100%;background:var(--copper);border-radius:0 4px 4px 0}
.bar .bv{font:400 12px var(--mono);color:var(--mute);text-align:right;white-space:nowrap}
.bar .bv span{color:var(--line2)}
.vrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.vrow:last-child{border-bottom:0}
.vrow b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow span{font:400 12px var(--mono);white-space:nowrap}
.btn{background:transparent;border:1px solid var(--line2);border-radius:var(--r);padding:9px 16px;cursor:pointer;white-space:nowrap;color:var(--paper)}
.btn:hover{border-color:var(--copper)}
.btn.pri{background:var(--copper);color:var(--ink);border-color:var(--copper);font-weight:600;letter-spacing:.02em;padding:10px 18px}
.btn.pri:hover{background:var(--copper2);border-color:var(--copper2)}
.btn.ghost{border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--paper);border-color:var(--line2)}
.btn.danger{color:var(--bad)}
input,select,textarea{width:100%;background:var(--cask);border:1px solid var(--line);border-radius:var(--r);padding:10px;color:var(--paper);font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--copper)}
input::placeholder,textarea::placeholder{color:#7d6f5c}
select{background:var(--cask2)}
textarea{resize:vertical;min-height:70px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--copper)}
label{display:block;font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.chk{display:flex;gap:10px;align-items:center;color:var(--paper);font:400 15px var(--sans);letter-spacing:0;text-transform:none;margin:0}
.chk input{width:auto;accent-color:var(--copper)}
.code{font:500 1.2rem/1 var(--mono);letter-spacing:.14em;color:var(--copper2);border:1px dashed var(--peat);border-radius:var(--r);padding:10px 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:var(--r);border-left:3px solid var(--copper);z-index:50;max-width:90%;font-weight:500;box-shadow:0 10px 24px -14px #000}

.auth{max-width:420px;margin:24px auto;display:flex;flex-direction:column;gap:14px}
.auth h2{font-size:1.8rem}
.or{display:flex;align-items:center;gap:10px;font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.btn.google{background:var(--paper);color:var(--ink);font-weight:600;border-color:var(--paper);display:flex;gap:10px;justify-content:center;align-items:center}
.btn.google:hover{background:#fff8ea}
.banner{border:1px solid var(--line);border-left:3px solid var(--copper);border-radius:var(--r);padding:14px 16px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px}
.stat{padding:16px 20px 16px 0}
.stat span{display:block;font:400 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.stat b{display:block;font:400 1.9rem/1.2 var(--serif);margin-top:4px}
.tools{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.tools input[type=search],.tools input#q,.tools input#fq{flex:1 1 200px;width:auto;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:10px 2px}
.tools input[type=search]:focus{border-bottom-color:var(--copper)}
.tools select{flex:0 0 auto;width:auto;padding:9px 12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:var(--paper);color:var(--ink);border-radius:var(--r);cursor:pointer;display:flex;flex-direction:column;box-shadow:0 1px 0 #0006,0 10px 24px -14px #000}
.card:hover{transform:translateY(-3px)}
.card .pic{margin:10px 10px 0}
.pic{position:relative;aspect-ratio:4/3;background:var(--stripes);display:grid;place-items:center;overflow:hidden}
.pic:has(img){background:var(--cask2)}
.pic img{width:100%;height:100%;object-fit:contain;padding:8px}
.ph-l{font:400 10px var(--mono);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.gauge{position:absolute;left:0;top:0;bottom:0;width:5px;background:#0006}
.gauge i{position:absolute;left:0;right:0;bottom:0;background:var(--copper)}
.score{position:absolute;right:0;top:12px;background:var(--cask);color:var(--paper);padding:4px 10px 4px 12px;font:500 1.15rem/1.2 var(--serif);border-left:3px solid var(--copper)}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cbody .dist{font:400 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--peat)}
.cbody h3{font:500 1.25rem/1.2 var(--serif)}
.cbody p{margin:0;font-size:13px;color:var(--ink2)}
.cfoot{margin-top:auto;padding-top:10px;border-top:1px solid #1d160f26;display:flex;justify-content:space-between;gap:8px;font:400 12px var(--mono);color:#3b2d20}
.mk{font-size:12px;color:var(--ink2)}
.up{color:#3f6b3a}.down{color:#9a4a36}
.card .pill{border-color:#3f6b3a;color:#3f6b3a}
.empty{text-align:center;padding:64px 24px;color:var(--mute);border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;font:400 1.5rem var(--serif);color:var(--paper);margin-bottom:6px}

.list{display:flex;flex-direction:column;gap:12px}
.rows{border-top:1px solid var(--line)}
.item{display:flex;gap:16px;border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer;align-items:center}
.item.static{cursor:default}
.item:not(.static):hover .mid b{color:var(--copper2)}
.box .item:last-child{border-bottom:0;padding-bottom:0}
.item .th{width:48px;height:60px;background:var(--stripes);border-radius:var(--r);flex:none;overflow:hidden}
.item .th:has(img){background:var(--cask2)}
.item .th img{width:100%;height:100%;object-fit:contain}
.item .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .mid b{display:block;overflow:hidden;text-overflow:ellipsis;font:500 1.2rem var(--serif);transition:color .15s}
.item .mid>div:empty{display:none}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--peat);display:grid;place-items:center;font:400 1.15rem var(--serif);color:var(--copper2);flex:none}
.rank{font:400 12px var(--mono);color:var(--mute);width:24px;flex:none}
.pill{display:inline-block;font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border:1px solid var(--line2);color:var(--mute);margin:4px 6px 0 0}
.pill.ja{color:var(--good);border-color:var(--good)}.pill.vielleicht{color:var(--copper2);border-color:var(--copper2)}.pill.nein{color:var(--bad);border-color:var(--bad)}
.bigscore{font:500 1.5rem var(--serif);color:var(--copper2);min-width:48px;text-align:right}
.bigscore.none{color:var(--mute)}
.lead{margin:0 0 12px}
.lead b{color:var(--copper2);font-weight:500}

.modal{border:1px solid var(--line);border-radius:var(--r);background:var(--cask2);color:var(--paper);width:min(640px,calc(100% - 32px));max-height:94vh;padding:0}
.modal::backdrop{background:#0b0805d9}
.mbody{padding:24px;overflow:auto;max-height:92vh;display:flex;flex-direction:column;gap:18px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.mhead h2{font:400 1.6rem var(--serif)}
.x{background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--mute)}
.x:hover{color:var(--paper)}
.box{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:520px){.g3{grid-template-columns:1fr 1fr}}
.imgrow{display:flex;gap:18px;align-items:center}
.imgrow .pic{width:120px;aspect-ratio:3/4;flex:none}
.crop{width:min(100%,300px);aspect-ratio:3/4;margin:0 auto;position:relative;overflow:hidden;background:var(--cask);border:1px solid var(--line);border-radius:var(--r);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.crop:active{cursor:grabbing}
.crop img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;pointer-events:none;-webkit-user-drag:none}
.stack{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.stack .btn{width:100%;white-space:normal}
.note{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px}
.note.bad{border-color:var(--bad)}
.note.bad b{color:var(--bad)}
.reader{width:100%;min-height:120px;border-radius:var(--r);overflow:hidden;background:var(--cask)}
.res{display:flex;gap:12px;align-items:center;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;cursor:pointer;width:100%}
.res:hover b{color:var(--copper2)}
.res img,.res .ph{width:40px;height:50px;object-fit:contain;background:var(--stripes);border-radius:var(--r);display:grid;place-items:center;flex:none;font:400 1.1rem var(--serif);color:var(--mute)}
.res img{background:var(--cask)}
.res b{font-weight:500}
.res small{display:block;color:var(--mute);font-size:12px}
.results{display:flex;flex-direction:column}
.results label{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:none;border-radius:var(--r);padding:5px 12px;cursor:pointer;font-size:13px;color:var(--mute)}
.chip:hover{border-color:var(--copper);color:var(--paper)}
.chip.on{background:var(--copper);color:var(--ink);border-color:var(--copper);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font:400 12px var(--mono);color:var(--copper2);border:1px solid var(--line2);border-radius:var(--r);padding:4px 10px;text-decoration:none}
.links a:hover{border-color:var(--copper)}
.seg{display:flex;gap:6px}.seg button{flex:1}
.seg .on{background:var(--copper);color:var(--ink);border-color:var(--copper);font-weight:600}
.range-val{font:400 1.2rem var(--serif);color:var(--copper2);min-width:64px;text-align:right}
code{font-family:var(--mono);font-size:.9em;color:var(--copper2)}
@media(max-width:600px){
  .hwrap{padding-left:16px;padding-right:16px}
  main{padding:20px 16px 80px}
  .top h1{font-size:1.45rem}
  .top .kicker{display:none}
  #tabs{gap:22px}
  @media(max-width:480px){#tabs{gap:14px;justify-content:space-between}#tabs button{font-size:11px;letter-spacing:.06em}}
  input,select,textarea{font-size:16px} /* verhindert Zoom auf iOS */
  .mbody{padding:18px}
}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.btn,.chip,.links a{transition:border-color .15s,background-color .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="hwrap">
    <div class="brand"><div><h1>Whisky Vault</h1><span class="kicker">Privatarchiv</span></div><span id="chip"></span></div>
    <nav id="tabs" hidden>
      <button data-tab="sammlung">Sammlung</button>
      <button data-tab="degustation">Degustation</button>
      <button data-tab="kaufliste">Kaufliste</button>
      <button data-tab="freunde">Freunde<i class="dot" id="frdot" hidden></i></button>
      <button data-tab="konto">Konto</button>
    </nav>
  </div>
</header>
<main id="view"></main>
<div class="toast" id="toast" hidden></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,sendPasswordResetEmail,sendEmailVerification,updateProfile,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot,query,where,getDocs,writeBatch} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

/* =====================================================================
   1) HIER DEINE FIREBASE-WERTE EINTRAGEN
   Firebase-Konsole → Projekteinstellungen → Allgemein → Deine Apps → Web-App → Konfiguration
   Diese Werte sind öffentlich gedacht. Geschützt sind die Daten durch die Sicherheitsregeln in Firestore.
   ===================================================================== */
const firebaseConfig={
  apiKey:'AIzaSyCwIjBWjFpvdg_1OdEX5tRa0ywQAxcFyIs',
  authDomain:'whiskytracker-72fd0.firebaseapp.com',
  projectId:'whiskytracker-72fd0',
  storageBucket:'whiskytracker-72fd0.firebasestorage.app',
  messagingSenderId:'537278032645',
  appId:'1:537278032645:web:4c6ab6593b2c32ebb0256c'
};
const CONFIGURED=!String(firebaseConfig.apiKey).startsWith('DEIN_');
let app,auth,db;
if(CONFIGURED){
  app=initializeApp(firebaseConfig);
  auth=getAuth(app);auth.languageCode='de';
  db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()}),ignoreUndefinedProperties:true});
}

/* ============ Helfer ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>(v===''||v==null||isNaN(Number(String(v).replace(',','.'))))?null:Number(String(v).replace(',','.'));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d).toLocaleDateString('de-CH'):'';
const money=n=>(n==null||n===''||isNaN(n))?'–':new Intl.NumberFormat('de-CH',{style:'currency',currency:D.settings.currency}).format(n);
const PH=(t='Flaschenfoto')=>`<span class="ph-l">${t}</span>`;
const meta=b=>[b.age?b.age+' Jahre':'ohne Alter',b.abv?b.abv+' %':'',b.region].filter(Boolean).join(' · ');
const TAGS=['Rauchig','Torfig','Fruchtig','Süss','Würzig','Sherry','Vanille','Eiche','Maritim','Malzig','Floral','Cremig','Scharf','Bitter'];
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4500)}
const fail=e=>{console.error(e);toast('Speichern fehlgeschlagen: '+(e.code||e.message))};

/* ============ Zustand ============ */
const blankD=()=>({bottles:[],sessions:[],tastings:[],wishlist:[],settings:{currency:'CHF'}});
const blankFR=()=>({friends:[],incoming:[],outgoing:[],profiles:{}});
let ME=null,PROFILE=null,D=blankD(),FR=blankFR(),LEGACY=null,unsubs=[],PENDING_NAME=null;
let UI={tab:'sammlung',collView:'liste',layout:(()=>{try{return localStorage.getItem('wv-layout')==='liste'?'liste':'karten'}catch{return 'karten'}})(),sort:'name',filter:'alle',q:'',sessionId:null,kaufMode:'kauf',loading:true,friend:null,authMode:'login'};
let raf;const sched=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(render)};

/* ============ Datenzugriff (Firestore) ============ */
function isOpen(b){return b.opened??((b.fill??100)<100)}
const PUB=b=>({id:b.id,name:b.name,distillery:b.distillery||'',age:b.age??null,abv:b.abv??null,volume:b.volume??null,barcode:b.barcode||'',image:b.image||'',fill:b.fill??100,rating:b.rating??null,notes:b.notes||'',region:b.region||'',cask:b.cask||'',bottler:b.bottler||'',opened:isOpen(b),added:b.added||Date.now()}); // ohne Preise!
function upsert(kind,o){const a=D[kind],i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o)}
function put(kind,o){
  upsert(kind,o);const u=ME.uid;
  setDoc(doc(db,'users',u,kind,o.id),o).catch(fail);
  if(kind==='bottles')setDoc(doc(db,'profiles',u,'shared',o.id),PUB(o)).catch(fail);
  if(kind==='tastings'){const hs=hostSession(o.sessionId);if(hs)setDoc(doc(db,'groups',hs.groupId,'whiskies',o.id),GW(o)).catch(failG)}
  sched();
}
function del(kind,id){
  const old=kind==='tastings'?D.tastings.find(x=>x.id===id):null;
  D[kind]=D[kind].filter(x=>x.id!==id);const u=ME.uid;
  if(old){
    const hs=hostSession(old.sessionId);if(hs)deleteDoc(doc(db,'groups',hs.groupId,'whiskies',id)).catch(failG);
    const sj=D.sessions.find(x=>x.id===old.sessionId);if(sj?.groupId&&!sj.host&&old.fromGroup)put('sessions',{...sj,skip:[...(sj.skip||[]),id]});
  }
  deleteDoc(doc(db,'users',u,kind,id)).catch(fail);
  if(kind==='bottles')deleteDoc(doc(db,'profiles',u,'shared',id)).catch(fail);
  sched();
}
function saveSettings(){setDoc(doc(db,'users',ME.uid),{settings:D.settings},{merge:true}).catch(fail)}
async function commitOps(ops){for(let i=0;i<ops.length;i+=400){const wb=writeBatch(db);ops.slice(i,i+400).forEach(([k,r,d])=>k==='set'?wb.set(r,d):wb.delete(r));await wb.commit()}}
async function bulkSet({bottles=[],sessions=[],tastings=[],wishlist=[]}){
  const u=ME.uid,ops=[];
  bottles.forEach(b=>{b.id=b.id||uid();ops.push(['set',doc(db,'users',u,'bottles',b.id),b],['set',doc(db,'profiles',u,'shared',b.id),PUB(b)])});
  sessions.forEach(s=>{s.id=s.id||uid();ops.push(['set',doc(db,'users',u,'sessions',s.id),s])});
  tastings.forEach(t=>{t.id=t.id||uid();ops.push(['set',doc(db,'users',u,'tastings',t.id),t])});
  wishlist.forEach(w=>{w.id=w.id||uid();ops.push(['set',doc(db,'users',u,'wishlist',w.id),w])});
  await commitOps(ops);
}
async function wipeAll(){
  const u=ME.uid,ops=[];
  for(const k of['bottles','sessions','tastings','wishlist'])(await getDocs(collection(db,'users',u,k))).forEach(d=>ops.push(['del',d.ref]));
  (await getDocs(collection(db,'profiles',u,'shared'))).forEach(d=>ops.push(['del',d.ref]));
  await commitOps(ops);
}
function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';const r=crypto.getRandomValues(new Uint8Array(8));for(const x of r)c+=A[x%A.length];return c}
const fmtCode=c=>c?c.slice(0,4)+'-'+c.slice(4):'';

/* ============ Online-Abgleich (Open Food Facts) ============ */
async function getJSON(url){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),14000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
  catch(e){throw new Error(e.name==='AbortError'?'Zeitüberschreitung':/load failed|failed to fetch|networkerror|network request/i.test(e.message)?'Keine Verbindung zum Suchdienst':e.message)}
  finally{clearTimeout(t)}
}
const OFF_FIELDS='code,product_name,brands,image_front_url,image_front_small_url,quantity,nutriments';
function parseVol(q){
  if(!q)return null;const m=String(q).toLowerCase().replace(',','.').match(/([\d.]+)\s*(cl|ml|l)\b/);if(!m)return null;
  const v=parseFloat(m[1]);return Math.round(m[2]==='cl'?v*10:m[2]==='l'?v*1000:v);
}
function mapOff(p){
  const n=p.nutriments||{};const abv=n.alcohol_100g??n.alcohol_value??n.alcohol??null;
  const brand=Array.isArray(p.brands)?p.brands[0]:String(p.brands||'').split(',')[0];
  const img=p.image_front_url||p.image_url||p.image_front_small_url||p.image_small_url||'';
  const thumb=p.image_front_small_url||p.image_small_url||img;
  return{name:p.product_name||'(ohne Name)',distillery:(brand||'').trim(),barcode:String(p.code||''),image:img,thumb,abv:abv?Math.round(abv*10)/10:null,volume:parseVol(Array.isArray(p.quantity)?p.quantity[0]:p.quantity)};
}
/* Bekannte Marken, die oft zusammengeschrieben werden ("Glenmoray" -> "Glen Moray") */
const BRANDS=['Glen Moray','Glen Grant','Glen Scotia','Glen Garioch','Glen Elgin','Glen Ord','Glen Spey','Glen Keith','Glen Deveron','Old Pulteney','Old Fitzgerald','Royal Lochnagar','Royal Brackla','Highland Park','Johnnie Walker','Jack Daniels','Jim Beam','Makers Mark','Wild Turkey','Four Roses','Captain Morgan','Port Charlotte','Port Ellen','Ben Nevis','Loch Lomond','Black Bottle','Monkey Shoulder','Western Gold','Tullamore Dew','Isle of Jura','Isle of Skye','Bank Note','Dewars','Chivas Regal','Ballantines','Cutty Sark','Famous Grouse','Grants','Teachers','Bell s'];
const flat=t=>String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function queryVariants(q){
  const out=[q];const f=flat(q);
  for(const b of BRANDS){const bf=flat(b);if(f.startsWith(bf)&&!q.toLowerCase().startsWith(b.toLowerCase())){let n=0,i=0;while(i<q.length&&n<bf.length){if(/[a-z0-9]/i.test(q[i]))n++;i++}out.push((b+' '+q.slice(i)).replace(/\s+/g,' ').trim());break}}
  const w=out[out.length-1].split(/\s+/);
  for(let n=Math.min(w.length-1,3);n>=1;n--){const t=w.slice(0,n).join(' ');if(n>1||t.length>=6)out.push(t)}
  return[...new Set(out.map(x=>x.trim()).filter(Boolean))];
}
const sameItem=(a,b)=>(a.barcode&&a.barcode===b.barcode)||flat(a.name)===flat(b.name);
function dedupe(list){const r=[];for(const it of list)if(!r.some(x=>sameItem(x,it)))r.push(it);return r}

async function offByCode(code){
  let last;
  for(const u of[`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`,`https://world.openfoodfacts.org/api/v0/product/${encodeURIComponent(code)}.json`]){
    try{const j=await getJSON(u);if(j.status===1&&j.product)return{...mapOff({...j.product,code:j.product.code||code}),src:'Open Food Facts'}}catch(e){last=e}
  }
  if(last)throw last;return null;
}
/* Quelle 2: UPCitemdb (kostenlose Testschnittstelle, ohne Schlüssel) */
function mapUpc(p){
  const img=(p.images||[])[0]||'';
  return{name:p.title||'(ohne Name)',distillery:p.brand||'',barcode:String(p.ean||p.upc||''),image:img,thumb:img,abv:null,volume:parseVol(p.size),src:'UPCitemdb'};
}
async function upcByCode(code){
  const j=await getJSON(`https://api.upcitemdb.com/prod/trial/lookup?upc=${encodeURIComponent(code)}`);
  return (j.items||[]).length?mapUpc(j.items[0]):null;
}
async function upcSearch(q){
  const j=await getJSON(`https://api.upcitemdb.com/prod/trial/search?s=${encodeURIComponent(q+' whisky')}&match_mode=0&type=product`);
  return (j.items||[]).map(mapUpc);
}
/* Quelle 3: Wikidata (Marken/Brennereien, liefert Namen, keine Barcodes) */
async function wikiSearch(q){
  const j=await getJSON(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(q)}&language=de&uselang=de&type=item&limit=10&format=json&origin=*`);
  return (j.search||[]).filter(e=>/whisk|distill|brenner|destill|spirit|bourbon|scotch|rum\b|brand/i.test(e.description||'')).map(e=>({name:e.label,distillery:e.label,barcode:'',image:'',thumb:'',abv:null,volume:null,src:'Wikidata',note:e.description||''}));
}
async function codeLookup(code){
  const rs=await Promise.allSettled([offByCode(code),upcByCode(code)]);
  const hit=rs.map(r=>r.value).find(Boolean);
  if(hit)return[hit];
  if(rs.every(r=>r.status==='rejected'))throw rs[0].reason;
  return[];
}
async function offSearch(q){
  const clean=q.replace(/[()"\[\]{}:]/g,' ').replace(/\s+/g,' ').trim();
  const variants=queryVariants(clean);
  const sal=async(t,cat)=>{
    const j=await getJSON(`https://search.openfoodfacts.org/search?q=${encodeURIComponent((t+(cat?' categories_tags:"en:whiskies"':'')).trim())}&page_size=15&langs=de,en`);
    return (j.hits||[]).filter(p=>p.product_name).map(mapOff);
  };
  const legacy=async t=>{
    const j=await getJSON(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(t)}&search_simple=1&action=process&json=1&page_size=15&fields=${OFF_FIELDS}`);
    return (j.products||[]).filter(p=>p.product_name).map(mapOff);
  };
  let err,ok=false;
  for(const t of variants){
    for(const run of[()=>sal(t,true),()=>sal(t,false),()=>legacy(t)]){
      try{const r=await run();ok=true;if(r.length)return r.map(x=>({...x,src:'Open Food Facts'}))}catch(e){err=e}
    }
  }
  if(!ok)throw err;return[];
}
async function searchAll(q){
  const variants=queryVariants(q.replace(/[()"\[\]{}:]/g,' ').replace(/\s+/g,' ').trim());
  const rs=await Promise.allSettled([offSearch(q),upcSearch(variants[Math.min(1,variants.length-1)]),wikiSearch(variants[Math.min(1,variants.length-1)])]);
  if(rs.every(r=>r.status==='rejected'))throw rs[0].reason;
  return dedupe(rs.flatMap(r=>r.value||[]));
}
async function openPrices(code){
  const j=await getJSON(`https://prices.openfoodfacts.org/api/v1/prices?product_code=${encodeURIComponent(code)}&order_by=price&size=60`);
  return (j.items||[]).filter(i=>i.price!=null).map(i=>({price:Number(i.price),currency:i.currency,date:i.date,place:(i.location&&(i.location.osm_name||i.location.osm_address_city))||''}));
}
async function cacheImage(url){
  if(!url)return'';
  try{const r=await fetch(url);if(!r.ok)throw 0;return await fileToDataURL(await r.blob())}catch{return url}
}
function fileToDataURL(file,max=480){
  return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.78))};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Bild nicht lesbar'))};img.src=u});
}

  let n=(name||'').trim();const br=(brand||'').trim();
  if(br&&!flat(n).includes(flat(br)))n=(br+' '+n).trim();

    ['Google Shopping',`https://www.google.com/search?tbm=shop&q=${q}`],

/* Bild ausrichten: ziehen = verschieben, Regler / Mausrad / zwei Finger = zoomen */
function editImage(src){
  return new Promise(resolve=>{
    const d=modal(`<div class="mhead"><h2>Bild ausrichten</h2><button class="x" data-close aria-label="Schliessen">✕</button></div>
    <p class="muted sm" style="margin:0">Ziehe das Bild, bis das Etikett im Rahmen sitzt. Zoomen mit dem Regler oder zwei Fingern.</p>
    <div class="crop" data-f><img alt=""></div>
    <input type="range" min="0.5" max="5" step="0.01" value="1" data-z aria-label="Zoom">
    <div class="row wrap sb"><button class="btn ghost" data-reset>Zurücksetzen</button><div class="row wrap"><button class="btn ghost" data-close>Abbrechen</button><button class="btn pri" data-ok>Übernehmen</button></div></div>`);
    let done=false;const finish=v=>{if(done)return;done=true;resolve(v);if(d.open)d.close()};
    d.addEventListener('close',()=>finish(null));
    const fr=$('[data-f]',d),im=$('img',fr),z=$('[data-z]',d);
    let W=0,H=0,nw=0,nh=0,s0=1,zoom=1,x=0,y=0;
    const sc=()=>s0*zoom;
    const clamp=()=>{const w=nw*sc(),h=nh*sc();x=Math.min(W-w*.2,Math.max(-w*.8,x));y=Math.min(H-h*.2,Math.max(-h*.8,y))};
    const draw=()=>{clamp();im.style.transform=`translate(${x}px,${y}px) scale(${sc()})`;z.value=zoom};
    const reset=()=>{zoom=1;x=(W-nw*s0)/2;y=(H-nh*s0)/2;draw()};
    const zoomAt=(nz,cx,cy)=>{nz=Math.min(5,Math.max(.5,nz));const r=nz/zoom;x=cx-(cx-x)*r;y=cy-(cy-y)*r;zoom=nz;draw()};
    im.onload=()=>{W=fr.clientWidth;H=fr.clientHeight;nw=im.naturalWidth;nh=im.naturalHeight;im.style.width=nw+'px';im.style.height=nh+'px';s0=Math.min(W/nw,H/nh);reset()};
    im.onerror=()=>{alert('Bild kann nicht bearbeitet werden.');finish(null)};
    if(/^https?:/.test(src))im.crossOrigin='anonymous';
    im.src=src;
    z.oninput=()=>zoomAt(Number(z.value),W/2,H/2);
    $('[data-reset]',d).onclick=reset;
    const ptr=new Map();let pd=0;
    fr.addEventListener('pointerdown',e=>{fr.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});pd=0});
    fr.addEventListener('pointermove',e=>{
      const p=ptr.get(e.pointerId);if(!p)return;
      const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
      if(ptr.size===1){x+=dx;y+=dy;draw()}
      else if(ptr.size===2){const [a,b]=[...ptr.values()];const dist=Math.hypot(a.x-b.x,a.y-b.y);const r=fr.getBoundingClientRect();if(pd)zoomAt(zoom*dist/pd,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pd=dist}
    });
    const up=e=>{ptr.delete(e.pointerId);pd=0};
    fr.addEventListener('pointerup',up);fr.addEventListener('pointercancel',up);
    fr.addEventListener('wheel',e=>{e.preventDefault();const r=fr.getBoundingClientRect();zoomAt(zoom*(e.deltaY<0?1.1:1/1.1),e.clientX-r.left,e.clientY-r.top)},{passive:false});
    $('[data-ok]',d).onclick=()=>{
      try{
        const k=480/W,c=document.createElement('canvas');c.width=480;c.height=Math.round(H*k);
        const g=c.getContext('2d');g.fillStyle='#17120e';g.fillRect(0,0,c.width,c.height);
        g.drawImage(im,x*k,y*k,nw*sc()*k,nh*sc()*k);
        finish(c.toDataURL('image/jpeg',.82));
      }catch{alert('Bild kann nicht bearbeitet werden.');finish(null)}
    };
  });
}

function modal(html){

  d.addEventListener('click',e=>{if(e.target.closest('[data-close]'))d.close()});
  d.showModal();return d;
}
let h5;
const loadH5=()=>h5??=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';s.onload=res;s.onerror=()=>{h5=null;rej(new Error('Scanner konnte nicht geladen werden'))};document.head.appendChild(s)});
async function scanBarcode(opts={}){
  const qr=!!opts.qr,hint=qr?'Halte den QR-Code ruhig in den Rahmen.':'Halte den Strichcode (EAN) ruhig und gut beleuchtet in den Rahmen.';
  try{await loadH5()}catch(e){alert(e.message);return null}
  return new Promise(resolve=>{
    const d=modal(`<div class="mhead"><h2>${qr?'QR-Code scannen':'Barcode scannen'}</h2><button class="x" data-close aria-label="Schliessen">✕</button></div><div id="reader" class="reader"></div><p class="muted sm" id="rmsg">${hint}</p><div id="mcamrow" hidden><label>Kamera</label><select id="mcam"></select></div><div class="row"><button class="btn" id="mphoto">${qr?'Foto vom QR-Code':'Foto vom Barcode'}</button><input type="file" accept="image/*" capture="environment" hidden id="mfile"></div><div class="row"><input id="mcode" placeholder="${qr?'oder Link bzw. Code einfügen':'oder Nummer eintippen'}" ${qr?'':'inputmode="numeric"'}><button class="btn pri" id="mok">OK</button></div>`);
    let q,done=false;
    const finish=async v=>{if(done)return;done=true;try{await q?.stop()}catch{}try{q?.clear()}catch{}d.close();resolve(v)};
    d.addEventListener('close',()=>finish(null));
    $('#mok',d).onclick=()=>{const raw=$('#mcode',d).value;const v=qr?raw.trim():raw.replace(/\D/g,'');if(v)finish(v)};
    $('#mcode',d).addEventListener('keydown',e=>{if(e.key==='Enter')$('#mok',d).click()});
    const fmts=qr?[Html5QrcodeSupportedFormats.QR_CODE]:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E];
    q=new Html5Qrcode('reader',{formatsToSupport:fmts,useBarCodeDetectorIfSupported:true,experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
    $('#mphoto',d).onclick=()=>$('#mfile',d).click();
    $('#mfile',d).onchange=async e=>{
      const file=e.target.files[0];if(!file)return;
      $('#rmsg',d).textContent='Foto wird gelesen …';
      try{try{await q.stop()}catch{}const r=await q.scanFile(file,false);finish(r)}
      catch{$('#rmsg',d).innerHTML='<span class="err">Im Foto wurde kein Barcode erkannt. Näher ran, gerade fotografieren, oder Nummer eintippen.</span>'}
    };
    const sel=$('#mcam',d),camRow=$('#mcamrow',d);
    const prefGet=()=>{try{return localStorage.getItem('wv-cam')||''}catch{return ''}};
    const prefSet=v=>{try{localStorage.setItem('wv-cam',v)}catch{}};
    const qrbox=(w,h)=>({width:Math.floor(w*.9),height:Math.floor(Math.min(h,w)*.45)});
    /* Wichtig: Mit videoConstraints ignoriert die Bibliothek die Kamera-Angabe im ersten Argument.
       Deshalb steht die Kamerawahl (Rückkamera) hier selbst in den Constraints. */
    const attempts=id=>[...(id?[{deviceId:{exact:id}}]:[]),{facingMode:{exact:'environment'}},{facingMode:{ideal:'environment'}},{}]
      .map(c=>({width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}],...c}));
    const startCam=async id=>{
      let last;
      for(const vc of attempts(id)){
        try{await q.start({facingMode:'environment'},{fps:15,qrbox,videoConstraints:vc},t=>finish(t),()=>{});return}
        catch(e){last=e;try{await q.stop()}catch{}}
      }
      throw last;
    };
    const listCams=async()=>{
      try{
        const cams=await Html5Qrcode.getCameras();
        if(cams.length<2)return;
        let cur='';try{cur=q.getRunningTrackSettings().deviceId||''}catch{}
        sel.innerHTML=cams.map((c,i)=>`<option value="${esc(c.id)}">${esc(c.label||'Kamera '+(i+1))}</option>`).join('');
        if(cur)sel.value=cur;
        camRow.hidden=false;
      }catch{}
    };
    sel.onchange=async()=>{
      prefSet(sel.value);$('#rmsg',d).textContent='Kamera wird gewechselt …';
      try{await q.stop()}catch{}
      try{await startCam(sel.value);$('#rmsg',d).textContent=hint}
      catch{$('#rmsg',d).innerHTML='<span class="err">Diese Kamera lässt sich nicht starten. Wähle eine andere.</span>'}
    };
    startCam(prefGet()).then(listCams).catch(()=>{$('#reader',d).innerHTML='<p class="err" style="padding:12px">Kamera nicht verfügbar. Erlaube den Kamerazugriff, nutze „Foto vom Barcode“ oder tippe die Nummer ein.</p>'});
  });
}
async function lookupInto(el,q,onPick){
  q=q.trim();if(!q)return;
  el.innerHTML='<p class="muted sm">Suche läuft …</p>';
  try{
    const items=/^\d{8,14}$/.test(q)?await codeLookup(q):await searchAll(q);
    if(!items.length){el.innerHTML='<div class="note"><b>Nichts gefunden.</b> Versuche nur die Marke (z. B. „Glen Moray“), scanne den Barcode oder trage die Daten von Hand ein.</div>';return}
    el.innerHTML=items.map((it,i)=>`<button class="res" data-i="${i}">${it.thumb?`<img src="${esc(it.thumb)}" alt="">`:'<span class="ph"></span>'}<span><b>${esc(it.name)}</b><small>${esc([it.note||it.distillery,it.abv?it.abv+' %':'',it.volume?it.volume+' ml':'',it.barcode,it.src].filter(Boolean).join(' · '))}</small></span></button>`).join('');

function priceBox(d,{getName,getCode,getBrand,onApply}){

function renderSetup(v){

  <div class="or">oder mit E-Mail</div>
  ${reg?'<div><label>Name (für Freunde sichtbar)</label><input name="name" autocomplete="name"></div>':''}
  <div><label>E-Mail</label><input name="email" type="email" autocomplete="email" inputmode="email"></div>
  <div><label>Passwort</label><input name="pw" type="password" autocomplete="${reg?'new-password':'current-password'}"></div>

  <p class="sm" data-msg></p></div>`;
  const msg=(t,ok)=>{const m=$('[data-msg]',v);m.className='sm '+(ok?'ok':'err');m.textContent=t};

    const email=f('email').value.trim(),pw=f('pw').value;

    try{
      if(reg){
        const name=f('name').value.trim();PENDING_NAME=name||null;
        const c=await createUserWithEmailAndPassword(auth,email,pw);
        if(name)await updateProfile(c.user,{displayName:name}).catch(()=>{});
        sendEmailVerification(c.user).catch(()=>{});
      }else await signInWithEmailAndPassword(auth,email,pw);
    }catch(e){PENDING_NAME=null;msg(authMsg(e))}

  };
  v.onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')go()};

/* ============ Statistik ============ */
function barList(rows,fmt=v=>v){
  const m=Math.max(...rows.map(r=>r.value),1);
  return `<div class="bars">${rows.map(r=>`<div class="bar" title="${esc(r.label+': '+fmt(r.value)+(r.sub?' · '+r.sub:''))}"><div class="bl">${esc(r.label)}</div><div class="bt"><i style="width:${Math.max(2,r.value/m*100)}%"></i></div><div class="bv">${esc(fmt(r.value))}${r.sub?` <span>·</span> ${esc(r.sub)}`:''}</div></div>`).join('')}</div>`;
}
function groupBy(list,key,val=()=>1){const m=new Map();list.forEach(b=>{const k=key(b);if(!k)return;m.set(k,(m.get(k)||0)+val(b))});return[...m].map(([label,value])=>({label,value}))}
function statsHTML(){
  const B=D.bottles;
  if(!B.length)return '<div class="empty"><b>Noch keine Daten</b>Sobald du Flaschen erfasst hast, erscheinen hier Auswertungen.</div>';
  const L=n=>(Math.round(n/100)/10).toLocaleString('de-CH')+' l';
  const vol=B.reduce((s,b)=>s+(b.volume||0),0),rest=B.reduce((s,b)=>s+(b.volume||0)*(isOpen(b)?(b.fill??100):100)/100,0);
  const priced=B.filter(b=>b.price!=null),avgP=priced.length?priced.reduce((s,b)=>s+b.price,0)/priced.length:null;
  const open=B.filter(isOpen).length;
  const val=b=>b.market?.price??b.price??0;
  let h=`<section class="stats"><div class="stat"><span>Inhalt gesamt</span><b>${L(vol)}</b></div><div class="stat"><span>Noch im Regal</span><b>${L(rest)}</b></div><div class="stat"><span>Ø Preis / Flasche</span><b>${money(avgP)}</b></div><div class="stat"><span>Geöffnet / zu</span><b>${open} / ${B.length-open}</b></div></section>`;
  const dist=groupBy(B,b=>(b.distillery||'').trim()).sort((a,b)=>b.value-a.value).slice(0,8);
  if(dist.length)h+=`<h3 class="sub">Top Brennereien</h3>${barList(dist,v=>v+(v===1?' Flasche':' Flaschen'))}`;
  const reg=groupBy(B,b=>(b.region||'').trim()).sort((a,b)=>b.value-a.value).slice(0,8);
  if(reg.length){const w=groupBy(B,b=>(b.region||'').trim(),val);reg.forEach(r=>r.sub=money(w.find(x=>x.label===r.label).value));h+=`<h3 class="sub">Regionen (Anzahl · Wert)</h3>${barList(reg,v=>v+(v===1?' Flasche':' Flaschen'))}`}
  else h+=`<h3 class="sub">Regionen</h3><p class="muted sm" style="margin:0">Trage bei den Flaschen die Region ein, dann erscheint hier die Verteilung.</p>`;
  const tags=new Map();D.tastings.forEach(t=>(t.tags||[]).forEach(g=>tags.set(g,(tags.get(g)||0)+1)));
  const tg=[...tags].map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value).slice(0,10);
  if(tg.length)h+=`<h3 class="sub">Geschmacksprofil (aus ${D.tastings.length} Bewertungen)</h3>${barList(tg,v=>v+'×')}`;
  const yr=groupBy(priced,b=>String((b.bought||'').slice(0,4)||new Date(b.added||Date.now()).getFullYear()),b=>b.price).sort((a,b)=>a.label.localeCompare(b.label));
  if(yr.length)h+=`<h3 class="sub">Ausgaben pro Jahr</h3>${barList(yr,v=>money(v))}`;
  const best=B.filter(b=>b.rating!=null).sort((a,b)=>b.rating-a.rating).slice(0,5).map(b=>({label:b.name,value:b.rating}));
  if(best.length)h+=`<h3 class="sub">Beste Bewertungen</h3>${barList(best,v=>v+' Punkte')}`;
  const dif=B.filter(b=>b.market?.price!=null&&b.price!=null).map(b=>({b,d:b.market.price-b.price})).filter(x=>x.d!==0).sort((a,b)=>b.d-a.d);
  if(dif.length){
    const row=x=>`<div class="vrow"><b>${esc(x.b.name)}</b><span class="${x.d>0?'up':'down'}">${x.d>0?'+':'−'}${money(Math.abs(x.d))}</span></div>`;
    const top=dif.filter(x=>x.d>0).slice(0,3),low=dif.filter(x=>x.d<0).slice(-3).reverse();
    if(top.length)h+=`<h3 class="sub">Grösster Wertzuwachs</h3>${top.map(row).join('')}`;
    if(low.length)h+=`<h3 class="sub">Grösster Wertverlust</h3>${low.map(row).join('')}`;
  }
  return h;
}

const sorters={

  rating:(a,b)=>(b.rating??-1)-(a.rating??-1),
  price:(a,b)=>(b.price??-1)-(a.price??-1),
  fill:(a,b)=>a.fill-b.fill,
  dist:(a,b)=>(a.distillery||'').localeCompare(b.distillery||'','de')||a.name.localeCompare(b.name,'de'),
  new:(a,b)=>(b.added||0)-(a.added||0)
};
const FILTERS={
  alle:['Alle',()=>true],
  offen:['Geöffnet',b=>isOpen(b)],
  zu:['Ungeöffnet',b=>!isOpen(b)],

function fillGrid(){
  const q=UI.q.trim().toLowerCase();

function openSheetScan(){
  if(!UI.sessionId)return;
  const d=modal(`<div class="mhead"><h2>Liste scannen</h2><button class="x" data-close aria-label="Schliessen">✕</button></div>
  <p class="muted sm" style="margin:0">Fotografiere das Blatt mit den Whiskys der Degustation. Die App liest den Text, du prüfst die Liste und fügst sie ein. Beim ersten Mal lädt die Texterkennung etwa 7 MB.</p>
  <div class="row"><button class="btn pri" data-photo>Blatt fotografieren</button><button class="btn" data-pick>Bild wählen</button><input type="file" accept="image/*" capture="environment" hidden data-cam><input type="file" accept="image/*" hidden data-file></div>
  <div class="note" data-st hidden></div>
  <div><label>Whiskys (ein Name pro Zeile, du kannst alles ändern)</label><textarea name="lines" rows="9" placeholder="1. Glen Moray Elgin Classic 40 %&#10;2. Lagavulin 16&#10;…" style="min-height:160px"></textarea></div>
  <label class="chk"><input type="checkbox" name="enr" checked> Daten online ergänzen (Bild, Brennerei, Alkohol)</label>
  <div class="row sb"><button class="btn ghost" data-close>Abbrechen</button><button class="btn pri" data-add>Hinzufügen</button></div>`);
  const st=$('[data-st]',d),ta=$('[name=lines]',d);
  const run=async file=>{
    if(!file)return;st.hidden=false;st.textContent='Bild wird vorbereitet …';
    try{
      const text=await ocrFile(file,m=>{st.textContent=m});
      const lines=cleanSheet(text);
      ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+lines.join('\n');
      st.textContent=lines.length?`${lines.length} Zeilen erkannt. Prüfe die Liste und entferne, was kein Whisky ist.`:'Es wurde kein Text erkannt. Versuche ein schärferes Foto oder tippe die Namen ein.';
    }catch(e){st.innerHTML=`<span class="err">${esc(e.message||'Texterkennung fehlgeschlagen')}</span>`}
  };
  $('[data-photo]',d).onclick=()=>$('[data-cam]',d).click();
  $('[data-pick]',d).onclick=()=>$('[data-file]',d).click();
  $$('input[type=file]',d).forEach(i=>i.onchange=e=>{const f=e.target.files[0];e.target.value='';run(f)});
  $('[data-add]',d).onclick=()=>{
    const names=ta.value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!names.length){ta.focus();return}
    const added=[];names.forEach((l,i)=>{const w=splitAbv(l);const t=addTastingQuiet({...w,n:i});if(t)added.push(t)});
    const enrich=$('[name=enr]',d).checked;d.close();
    toast(added.length?`${added.length} Whisky${added.length>1?'s':''} hinzugefügt`:'Alle Whiskys waren schon in der Degustation');
    if(enrich&&added.length)setTimeout(()=>enrichTastings(added),1200);
  };
}

/* ============ Degustation ============ */
function rTast(v){
  const ses=D.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(UI.sessionId&&!D.sessions.find(s=>s.id===UI.sessionId))UI.sessionId=null;
  if(!UI.sessionId&&ses[0])UI.sessionId=ses[0].id;
  const cur=D.sessions.find(s=>s.id===UI.sessionId);
  let html=`<h2 class="ptitle">Degustationen</h2><div class="tools"><select id="ses" ${ses.length?'':'disabled'} style="flex:1 1 200px">${ses.map(s=>`<option value="${s.id}" ${s.id===UI.sessionId?'selected':''}>${esc(s.name)} – ${fmtDate(s.date)}</option>`).join('')||'<option>Noch keine Degustation</option>'}</select><button class="btn pri" id="newses">+ Neue Degustation</button>${cur?'<button class="btn ghost danger" id="delses">Löschen</button>':''}</div><div class="tools" style="margin-top:-8px">${cur?'<button class="btn" id="sheet">Liste scannen</button><button class="btn" id="share">Teilen</button>':''}<button class="btn" id="join">Beitreten</button></div>${cur?.groupId?`<p class="muted sm" style="margin:-8px 0 16px">${cur.host?'Du teilst diese Degustation.':'Gemeinsam mit '+esc(cur.hostName||'einem Freund')+'.'}</p>`:''}`;
  if(!cur){v.innerHTML=html+'<div class="empty"><b>Starte eine Degustation</b>Lege einen Abend an, such die Whiskys per Name oder Barcode und bewerte jeden. Am Ende siehst du, was dir geschmeckt hat.</div>';bindSes();return}
  html+=`<div class="box" style="margin-bottom:16px"><label style="margin:0">Whisky zur Degustation hinzufügen</label><div class="row"><input id="tq" placeholder="Name oder Barcode (Sammlung & online)"><button class="btn" id="tgo">Suchen</button><button class="btn" id="tscan" title="Barcode scannen">Scannen</button></div><div class="results" id="tres"></div></div>`;
  const ts=D.tastings.filter(t=>t.sessionId===cur.id).sort((a,b)=>(b.score??-1)-(a.score??-1)||a.created-b.created);
  if(!ts.length)html+='<div class="empty"><b>Noch nichts im Glas</b>Such oben deinen ersten Whisky.</div>';
  else{
    const best=ts.find(t=>t.score!=null);
    html+=`<p class="muted sm lead">${ts.length} Whisky${ts.length>1?'s':''}${best?` · Favorit: <b>${esc(best.whisky.name)}</b> (${best.score})`:''}</p><div class="rows">${ts.map((t,i)=>tastingItem(t,t.score!=null?i+1:'')).join('')}</div>`;
  }
  v.innerHTML=html;bindSes();
  $$('.item',v).forEach(it=>it.onclick=()=>openTasting(it.dataset.id));
  const go=async(q)=>{q=q.trim();if(!q)return;await tastingSearch(q,$('#tres'))};
  $('#tgo').onclick=()=>go($('#tq').value);
  $('#tq').onkeydown=e=>{if(e.key==='Enter')go(e.target.value)};
  $('#tscan').onclick=async()=>{const c=await scanBarcode();if(c){$('#tq').value=c;go(c)}};
}
function tastingItem(t,rank){
  return `<div class="item" tabindex="0" role="button" data-id="${t.id}"><div class="rank">${rank}</div><div class="th">${t.whisky.image?`<img src="${esc(t.whisky.image)}" alt="">`:''}</div><div class="mid"><b>${esc(t.whisky.name)}</b><span class="muted sm">${esc([t.whisky.distillery,(t.tags||[]).join(', ')].filter(Boolean).join(' · '))}</span><div>${t.buy?`<span class="pill ${t.buy}">${{ja:'Kaufen',vielleicht:'Vielleicht',nein:'Nein'}[t.buy]}</span>`:''}${t.bottleId?'<span class="pill">in Sammlung</span>':''}</div></div><div class="bigscore${t.score==null?' none':''}">${t.score??'–'}</div></div>`;
}
function bindSes(){
  $('#newses').onclick=()=>{
    const d=modal(`<div class="mhead"><h2>Neue Degustation</h2><button class="x" data-close>✕</button></div><div><label>Name</label><input name="n" value="Degustation ${fmtDate(today())}"></div><div><label>Datum</label><input name="dt" type="date" value="${today()}"></div><div class="row sb"><span></span><div class="row"><button class="btn ghost" data-close>Abbrechen</button><button class="btn pri" data-s>Anlegen</button></div></div>`);
    $('[data-s]',d).onclick=()=>{const s={id:uid(),name:$('[name=n]',d).value.trim()||'Degustation',date:$('[name=dt]',d).value||today()};UI.sessionId=s.id;put('sessions',s);d.close()};
  };
  $('#join')?.addEventListener('click',async()=>{const c=await scanBarcode({qr:true});if(!c)return;const gid=parseJoin(c);if(gid)joinGroup(gid);else toast('Das ist kein Code einer Degustation.')});
  $('#sheet')?.addEventListener('click',openSheetScan);
  $('#share')?.addEventListener('click',()=>{const x=D.sessions.find(y=>y.id===UI.sessionId);if(x)shareSession(x)});
  const sel=$('#ses');if(sel&&!sel.disabled)sel.onchange=e=>{UI.sessionId=e.target.value;render()};
  const dl=$('#delses');if(dl)dl.onclick=()=>{if(confirm('Diese Degustation samt Bewertungen löschen?')){const sid=UI.sessionId,s0=D.sessions.find(x=>x.id===sid);D.tastings.filter(t=>t.sessionId===sid).forEach(t=>del('tastings',t.id));del('sessions',sid);UI.sessionId=null;if(s0?.groupId&&s0.host)stopSharing(s0,true)}};
}
async function tastingSearch(q,el){
  const ql=q.toLowerCase();
  const own=D.bottles.filter(b=>[b.name,b.distillery,b.barcode].join(' ').toLowerCase().includes(ql));
  const ownHtml=own.map(b=>`<button class="res" data-own="${b.id}">${b.image?`<img src="${esc(b.image)}" alt="">`:'<span class="ph"></span>'}<span><b>${esc(b.name)}</b><small>Aus meiner Sammlung${b.barcode?' · '+esc(b.barcode):''}</small></span></button>`).join('');
  el.innerHTML=(ownHtml?`<label>Meine Sammlung</label>${ownHtml}`:'')+`<label>Online</label><div id="onl"></div><button class="res" data-manual><span class="ph">+</span><span><b>Von Hand hinzufügen: „${esc(q)}“</b><small>Falls online nichts passt</small></span></button>`;
  $$('[data-own]',el).forEach(b=>b.onclick=()=>{const x=D.bottles.find(y=>y.id===b.dataset.own);addTasting(x,x.id)});
  $('[data-manual]',el).onclick=()=>addTasting({name:/^\d{8,14}$/.test(q)?'':q,barcode:/^\d{8,14}$/.test(q)?q:''},null);
  await lookupInto($('#onl',el),q,async it=>{it.image=await cacheImage(it.image);addTasting(it,null)});
}
function addTasting(w,bottleId){
  const ex=D.tastings.find(t=>t.sessionId===UI.sessionId&&((bottleId&&t.bottleId===bottleId)||(w.barcode&&t.whisky.barcode===w.barcode)||(!w.barcode&&!bottleId&&w.name&&t.whisky.name.toLowerCase()===w.name.toLowerCase())));
  if(ex){openTasting(ex.id);return}
  const t={id:uid(),sessionId:UI.sessionId,bottleId:bottleId||null,whisky:{name:w.name||'',distillery:w.distillery||'',barcode:w.barcode||'',image:w.image||'',abv:w.abv||null,volume:w.volume||null},score:null,tags:[],nose:'',palate:'',finish:'',notes:'',buy:'',price:null,priceDate:null,created:Date.now()};
  put('tastings',t);openTasting(t.id);
}
function openTasting(id){
  const orig=D.tastings.find(x=>x.id===id);if(!orig)return;const t=structuredClone(orig);
  const d=modal(`<div class="mhead"><h2>Bewertung</h2><button class="x" data-close aria-label="Schliessen">✕</button></div>
  <div class="imgrow"><div class="pic" data-pic></div><div class="stack"><div><label>Name</label><input name="name" value="${esc(t.whisky.name)}"></div><div><label>Barcode</label><input name="barcode" inputmode="numeric" value="${esc(t.whisky.barcode)}"></div><button class="btn" data-a="photo">Foto wählen</button><button class="btn" data-a="crop">Bild ausrichten</button><input type="file" accept="image/*" hidden data-file></div></div>
  <div><label>Punkte (0–100)</label><div class="row"><input name="score" type="range" min="0" max="100" step="1" value="${t.score??75}"><span class="range-val" data-sv>${t.score??'–'}</span></div><div class="sm muted">Regler bewegen, um eine Note zu setzen.</div></div>
  <div><label>Geschmacksrichtung</label><div class="chips">${TAGS.map(g=>`<button class="chip ${(t.tags||[]).includes(g)?'on':''}" data-tag="${g}">${g}</button>`).join('')}</div></div>
  <div><label>Nase</label><textarea name="nose">${esc(t.nose)}</textarea></div>
  <div class="g2"><div><label>Gaumen</label><textarea name="palate">${esc(t.palate)}</textarea></div><div><label>Abgang</label><textarea name="finish">${esc(t.finish)}</textarea></div></div>
  <div><label>Würdest du ihn kaufen?</label><div class="seg" data-buy><button class="btn ${t.buy==='ja'?'on':''}" data-v="ja">Ja</button><button class="btn ${t.buy==='vielleicht'?'on':''}" data-v="vielleicht">Vielleicht</button><button class="btn ${t.buy==='nein'?'on':''}" data-v="nein">Nein</button></div></div>
  ${PRICE_HTML('Marktpreis (günstigster bekannter Preis)')}
  <div class="row wrap sb"><button class="btn danger" data-a="del">Löschen</button><div class="row wrap">
    ${t.bottleId?'<button class="btn" data-a="tobottle">Note in Sammlung übernehmen</button>':'<button class="btn" data-a="tocoll">In Sammlung übernehmen</button>'}
    <button class="btn pri" data-a="save">Speichern</button></div></div>`);
  const f=n=>d.querySelector(`[name=${n}]`);
  let img=t.whisky.image,src0=t.whisky.image,touched=t.score!=null,buy=t.buy;
  const pic=()=>{$('[data-pic]',d).innerHTML=img?`<img src="${esc(img)}" alt="">`:PH('Foto')};pic();
  if(t.price!=null)f('mprice').value=t.price;
  f('score').oninput=()=>{touched=true;$('[data-sv]',d).textContent=f('score').value};
  priceBox(d,{getName:()=>f('name').value,getCode:()=>f('barcode').value.trim(),getBrand:()=>t.whisky.distillery,onApply:p=>{f('mprice').value=p}});
  $$('.chip',d).forEach(c=>c.onclick=()=>{c.classList.toggle('on')});
  $$('[data-buy] button',d).forEach(b=>b.onclick=()=>{buy=buy===b.dataset.v?'':b.dataset.v;$$('[data-buy] button',d).forEach(x=>x.classList.toggle('on',x.dataset.v===buy))});
  const collect=()=>{
    t.whisky.name=f('name').value.trim()||'(ohne Name)';t.whisky.barcode=f('barcode').value.trim();t.whisky.image=img;
    t.score=touched?Number(f('score').value):null;t.tags=$$('.chip.on',d).map(c=>c.dataset.tag);
    t.nose=f('nose').value.trim();t.palate=f('palate').value.trim();t.finish=f('finish').value.trim();t.buy=buy;
    const p=num(f('mprice').value);if(p!==t.price){t.price=p;t.priceDate=p==null?null:today()}
  };
  d.addEventListener('click',async e=>{
    const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
    if(a==='photo')$('[data-file]',d).click();
    if(a==='crop'&&img){const o=await editImage(src0||img);if(o){img=o;pic()}}
    if(a==='save'){collect();put('tastings',t);d.close()}
    if(a==='del'&&confirm('Bewertung löschen?')){del('tastings',t.id);d.close()}
    if(a==='tobottle'){collect();put('tastings',t);const b=D.bottles.find(x=>x.id===t.bottleId);if(b&&t.score!=null)put('bottles',{...b,rating:t.score});d.close()}
    if(a==='tocoll'){collect();put('tastings',t);d.close();addToCollection(t.id)}
  });
  $('[data-file]',d).onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{src0=await fileToDataURL(file,1000);img=(await editImage(src0))||await fileToDataURL(file);pic()}catch(err){alert(err.message)}};
}
function addToCollection(tid){
  const t=D.tastings.find(x=>x.id===tid);if(!t)return;
  const b={id:uid(),name:t.whisky.name,distillery:t.whisky.distillery,age:null,abv:t.whisky.abv,volume:t.whisky.volume||700,barcode:t.whisky.barcode,image:t.whisky.image,fill:100,price:t.price,rating:t.score,notes:[t.nose&&'Nase: '+t.nose,t.palate&&'Gaumen: '+t.palate,t.finish&&'Abgang: '+t.finish].filter(Boolean).join('\n'),market:t.price!=null?{price:t.price,date:t.priceDate||today(),source:'Degustation'}:null,added:Date.now()};
  put('bottles',b);put('tastings',{...t,bottleId:b.id});UI.tab='sammlung';render();openBottle(b.id);
}

/* ============ Kaufliste ============ */
function wishRow(w){
  const reached=w.seen!=null&&w.target!=null&&w.seen<=w.target;
  const info=[w.distillery,w.target!=null?'Ziel '+money(w.target):'',w.seen!=null?'zuletzt '+money(w.seen):''].filter(Boolean).join(' · ');
  return `<div class="item" tabindex="0" role="button" data-w="${w.id}"><div class="th">${w.image?`<img src="${esc(w.image)}" alt="">`:''}</div><div class="mid"><b>${esc(w.name)}</b><span class="muted sm">${esc(info)}</span><div>${w.prio==='hoch'?'<span class="pill vielleicht">Hohe Priorität</span>':''}${reached?'<span class="pill ja">Zielpreis erreicht</span>':''}</div></div></div>`;
}
function rBuy(v){
  const all=UI.kaufMode==='alle';
  let list=D.tastings.filter(t=>all?true:(!t.bottleId&&(t.buy==='ja'||t.buy==='vielleicht')));
  list.sort((a,b)=>(all?0:((b.buy==='ja')-(a.buy==='ja')))||(b.score??-1)-(a.score??-1));
  const wl=all?[]:D.wishlist.slice().sort((a,b)=>((b.prio==='hoch')-(a.prio==='hoch'))||(b.added||0)-(a.added||0));
  const rowT=(t,i)=>{
    const ses=D.sessions.find(s=>s.id===t.sessionId);
    return `<div class="item" tabindex="0" role="button" data-id="${t.id}"><div class="rank">${i+1}</div><div class="th">${t.whisky.image?`<img src="${esc(t.whisky.image)}" alt="">`:''}</div><div class="mid"><b>${esc(t.whisky.name)}</b><span class="muted sm">${esc([ses?.name,t.price!=null?'ab '+money(t.price):''].filter(Boolean).join(' · '))}</span><div>${t.buy?`<span class="pill ${t.buy}">${{ja:'Kaufen',vielleicht:'Vielleicht',nein:'Nein'}[t.buy]}</span>`:''}${t.bottleId?'<span class="pill">in Sammlung</span>':''}</div></div><div class="bigscore${t.score==null?' none':''}">${t.score??'–'}</div></div>`};
  let body='';
  if(all)body=list.length?`<div class="rows">${list.map(rowT).join('')}</div>`:'<div class="empty"><b>Noch keine Bewertungen</b>Bewerte Whiskys im Tab Degustation.</div>';
  else if(!wl.length&&!list.length)body='<div class="empty"><b>Die Kaufliste ist leer</b>Tippe auf „+ Wunsch“, um einen Whisky vorzumerken. Whiskys, bei denen du in einer Degustation „Ja“ oder „Vielleicht“ wählst, landen ebenfalls hier.</div>';
  else body=(wl.length?`<h3 class="sub" style="margin-top:0">Meine Wunschliste</h3><div class="rows">${wl.map(wishRow).join('')}</div>`:'')+(list.length?`<h3 class="sub">Aus Degustationen</h3><div class="rows">${list.map(rowT).join('')}</div>`:'');
  v.innerHTML=`<h2 class="ptitle">${all?'Alle Bewertungen':'Kaufliste'}</h2><div class="tools"><div class="seg" style="flex:1"><button class="btn ${all?'':'on'}" data-m="kauf">Kaufliste</button><button class="btn ${all?'on':''}" data-m="alle">Alle Bewertungen</button></div>${all?'':'<button class="btn pri" id="wadd">+ Wunsch</button>'}</div>${body}`;
  $$('[data-m]',v).forEach(b=>b.onclick=()=>{UI.kaufMode=b.dataset.m;render()});
  $$('.item[data-id]',v).forEach(it=>it.onclick=()=>openTasting(it.dataset.id));
  $$('.item[data-w]',v).forEach(it=>it.onclick=()=>openWish(it.dataset.w));
  $('#wadd',v)?.addEventListener('click',()=>openWish());
}
function openWish(id){
  const isNew=!id;
  const w=id?structuredClone(D.wishlist.find(x=>x.id===id)):{id:uid(),name:'',distillery:'',barcode:'',image:'',note:'',target:null,seen:null,prio:'normal',added:Date.now()};
  const d=modal(`<div class="mhead"><h2>${isNew?'Wunsch hinzufügen':esc(w.name)}</h2><button class="x" data-close aria-label="Schliessen">✕</button></div>
  <div class="box"><label style="margin:0">Online suchen</label><div class="row"><input name="q" placeholder="Name oder Barcode (EAN)" enterkeyhint="search" style="min-width:0"><button class="btn" data-a="search">Suchen</button><button class="btn" data-a="scan" title="Barcode scannen">Scannen</button></div><div class="results" data-r></div></div>
  <div class="imgrow"><div class="pic" data-pic></div><div class="stack"><div><label>Name</label><input name="name" value="${esc(w.name)}" placeholder="z. B. Lagavulin 16"></div><div><label>Brennerei / Marke</label><input name="distillery" value="${esc(w.distillery)}"></div></div></div>

  <div class="box"><label style="margin:0">Preis prüfen</label><div class="links" data-plinks></div></div>
  <div><label>Notiz</label><textarea name="note">${esc(w.note)}</textarea></div>
  <div class="row wrap sb">${isNew?'<span></span>':'<button class="btn danger" data-a="del">Löschen</button>'}<div class="row wrap">${isNew?'':'<button class="btn" data-a="tocoll">In Sammlung übernehmen</button>'}<button class="btn pri" data-a="save">Speichern</button></div></div>`);
  const f=n=>d.querySelector(`[name=${n}]`);
  let img=w.image;
  const pic=()=>{$('[data-pic]',d).innerHTML=img?`<img src="${esc(img)}" alt="">`:PH('Foto')};pic();
  f('prio').value=w.prio||'normal';
  const links=()=>{$('[data-plinks]',d).innerHTML=priceLinks(f('name').value,f('barcode').value.trim(),f('distillery').value)};links();

    f('name').value=it.name;f('distillery').value=it.distillery||f('distillery').value;f('barcode').value=it.barcode||f('barcode').value;

    img=await cacheImage(it.image)||img;pic();links();$('[data-r]',d).innerHTML='<p class="ok sm">Daten übernommen.</p>';

  f('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
  const collect=()=>Object.assign(w,{name:f('name').value.trim(),distillery:f('distillery').value.trim(),barcode:f('barcode').value.trim(),prio:f('prio').value,target:num(f('target').value),seen:num(f('seen').value),note:f('note').value.trim(),image:img});
  d.addEventListener('click',async e=>{
    const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
    if(a==='search')search();
    if(a==='scan'){const c=await scanBarcode();if(c){f('q').value=c;search()}}
    if(a==='del'&&confirm('Diesen Wunsch löschen?')){del('wishlist',w.id);d.close()}
    if(a==='save'){if(!f('name').value.trim()){f('name').focus();return}collect();put('wishlist',w);d.close()}
    if(a==='tocoll'){if(!f('name').value.trim()){f('name').focus();return}collect();d.close();openBottle(null,{name:w.name,distillery:w.distillery,barcode:w.barcode,image:w.image,notes:w.note},{onSaved:()=>del('wishlist',w.id)})}
  });
}

/* ============ Freunde ============ */
const initial=n=>(n||'?').trim().charAt(0).toUpperCase();
function rFriends(v){
  if(UI.friend)return rFriendView(v);
  if(!PROFILE){v.innerHTML='<p class="muted">Profil wird geladen …</p>';return}
  const name=id=>esc(FR.profiles[id]?.name||'Unbekannt');
  v.innerHTML=`<div class="list" style="max-width:680px">
  <div class="box"><label style="margin:0">Dein Profil</label>
    <div><label>Anzeigename</label><div class="row"><input id="pname" value="${esc(PROFILE.name)}" maxlength="40"><button class="btn" id="psave">Speichern</button></div></div>
    <div><label>Dein Freundescode</label><div class="row"><span class="code">${fmtCode(PROFILE.code)}</span><button class="btn" id="pcopy">Kopieren</button></div><p class="sm muted" style="margin:6px 0 0">Gib den Code Freunden weiter. Wer ihn kennt, kann dir eine Anfrage schicken – sehen kann er deine Sammlung erst, wenn du annimmst.</p></div>
    <label class="chk"><input type="checkbox" id="pshare" ${PROFILE.share?'checked':''}> Freunde dürfen meine Sammlung sehen</label>
    <p class="sm muted" style="margin:0">Freunde sehen Name, Bild, Füllstand, Note und Notizen. Einstands- und Marktpreise sowie Degustationen bleiben privat.</p></div>
  <div class="box"><label style="margin:0">Freund hinzufügen</label><div class="row"><input id="fcode" placeholder="Freundescode, z. B. K7QF-2MXP" autocapitalize="characters" autocomplete="off"><button class="btn pri" id="fadd">Anfrage senden</button></div><div class="sm" id="fmsg"></div></div>
  ${FR.incoming.length?`<div class="box"><label style="margin:0">Anfragen an dich</label>${FR.incoming.map(r=>`<div class="row sb"><div class="row"><span class="avatar">${esc(initial(r.fromName))}</span><b>${esc(r.fromName||'Unbekannt')}</b></div><div class="row"><button class="btn pri" data-acc="${r.id}">Annehmen</button><button class="btn ghost" data-dec="${r.id}">Ablehnen</button></div></div>`).join('')}</div>`:''}
  ${FR.outgoing.length?`<div class="box"><label style="margin:0">Gesendete Anfragen</label>${FR.outgoing.map(r=>`<div class="row sb"><div class="row"><span class="avatar">${esc(initial(r.toName))}</span><span>${esc(r.toName||'Unbekannt')} <span class="muted sm">wartet auf Antwort</span></span></div><button class="btn ghost" data-dec="${r.id}">Zurückziehen</button></div>`).join('')}</div>`:''}
  <div class="box"><label style="margin:0">Deine Freunde (${FR.friends.length})</label>
    ${FR.friends.length?FR.friends.map(f=>`<div class="item static"><span class="avatar">${esc(initial(FR.profiles[f.id]?.name))}</span><div class="mid"><b>${name(f.id)}</b></div><button class="btn" data-view="${f.id}">Sammlung ansehen</button><button class="btn ghost danger" data-rm="${f.pid}" title="Freund entfernen">✕</button></div>`).join(''):'<p class="muted sm" style="margin:0">Noch keine Freunde. Tausche Codes aus und teile eure Sammlungen.</p>'}</div></div>`;
  $('#psave').onclick=()=>{const n=$('#pname').value.trim();if(!n)return;setDoc(doc(db,'profiles',ME.uid),{name:n},{merge:true}).then(()=>toast('Name gespeichert')).catch(fail)};
  $('#pcopy').onclick=async()=>{try{await navigator.clipboard.writeText(PROFILE.code);toast('Code kopiert')}catch{toast('Code: '+fmtCode(PROFILE.code))}};
  $('#pshare').onchange=e=>setDoc(doc(db,'profiles',ME.uid),{share:e.target.checked},{merge:true}).catch(fail);
  $('#fadd').onclick=()=>sendRequest($('#fcode').value);
  $('#fcode').onkeydown=e=>{if(e.key==='Enter')sendRequest(e.target.value)};
  $$('[data-acc]',v).forEach(b=>b.onclick=()=>acceptReq(FR.incoming.find(r=>r.id===b.dataset.acc)));
  $$('[data-dec]',v).forEach(b=>b.onclick=()=>deleteDoc(doc(db,'requests',b.dataset.dec)).catch(fail));
  $$('[data-view]',v).forEach(b=>b.onclick=()=>openFriend(b.dataset.view));
  $$('[data-rm]',v).forEach(b=>b.onclick=()=>{if(confirm('Freundschaft beenden? Ihr seht danach gegenseitig nichts mehr.'))deleteDoc(doc(db,'friends',b.dataset.rm)).catch(fail)});
}
async function sendRequest(raw){
  const code=String(raw).toUpperCase().replace(/[^A-Z0-9]/g,''),msg=$('#fmsg');
  const say=(t,ok)=>{msg.className='sm '+(ok?'ok':'err');msg.textContent=t};
  if(code.length!==8)return say('Der Code hat 8 Zeichen (z. B. K7QF-2MXP).');
  if(code===PROFILE.code)return say('Das ist dein eigener Code.');
  try{
    const s=await getDocs(query(collection(db,'profiles'),where('code','==',code)));
    if(s.empty)return say('Kein Profil mit diesem Code gefunden.');
    const fid=s.docs[0].id,fp=s.docs[0].data();
    if(FR.friends.some(f=>f.id===fid))return say('Ihr seid schon befreundet.');
    if(FR.incoming.some(r=>r.from===fid))return say(`${fp.name} hat dir bereits eine Anfrage geschickt – nimm sie oben an.`);
    if(FR.outgoing.some(r=>r.to===fid))return say('Die Anfrage ist schon unterwegs.');
    await setDoc(doc(db,'requests',ME.uid+'_'+fid),{from:ME.uid,to:fid,fromName:PROFILE.name,toName:fp.name,created:Date.now()});
    $('#fcode').value='';say(`Anfrage an ${fp.name} gesendet.`,true);
  }catch(e){say('Das hat nicht geklappt: '+(e.code||e.message))}
}
async function acceptReq(r){
  if(!r)return;
  const members=[r.from,ME.uid].sort();
  try{await setDoc(doc(db,'friends',members.join('_')),{members,created:Date.now()});await deleteDoc(doc(db,'requests',r.id));toast('Ihr seid jetzt befreundet')}catch(e){fail(e)}
}
async function openFriend(fid){
  UI.friend={id:fid,loading:true,items:[],q:'',onlyNew:false};render();
  try{UI.friend.items=(await getDocs(collection(db,'profiles',fid,'shared'))).docs.map(d=>d.data())}
  catch(e){UI.friend.error=e.code==='permission-denied'?'Diese Sammlung ist aktuell nicht freigegeben.':'Laden fehlgeschlagen ('+(e.code||e.message)+').'}
  UI.friend.loading=false;render();
}
const iHave=b=>D.bottles.some(x=>(b.barcode&&x.barcode===b.barcode)||x.name.trim().toLowerCase()===b.name.trim().toLowerCase());
function rFriendView(v){
  const F=UI.friend,p=FR.profiles[F.id]||{};
  const rated=F.items.filter(b=>b.rating!=null),avg=rated.length?Math.round(rated.reduce((s,b)=>s+b.rating,0)/rated.length):null;
  v.innerHTML=`<div class="tools"><button class="btn" id="back">← Zurück</button><h2 class="ptitle" style="flex:1;margin:0">${esc(p.name||'Freund')}</h2></div>
  ${F.loading?'<p class="muted">Lade Sammlung …</p>':F.error?`<div class="empty">${esc(F.error)}</div>`:`
  <section class="stats"><div class="stat"><span>Flaschen</span><b>${F.items.length}</b></div><div class="stat"><span>Ø Note</span><b>${avg??'–'}</b></div><div class="stat"><span>Fehlen dir</span><b>${F.items.filter(b=>!iHave(b)).length}</b></div></section>
  <div class="tools"><input id="fq" type="search" placeholder="Sammlung durchsuchen" value="${esc(F.q)}"><label class="chk"><input type="checkbox" id="fnew" ${F.onlyNew?'checked':''}> nur was ich nicht habe</label></div><div id="fgrid"></div>`}`;
  $('#back').onclick=()=>{UI.friend=null;render()};
  if(F.loading||F.error)return;
  const fill=()=>{
    const q=F.q.trim().toLowerCase();
    const list=F.items.filter(b=>(!q||[b.name,b.distillery,b.notes].join(' ').toLowerCase().includes(q))&&(!F.onlyNew||!iHave(b))).sort((a,b)=>(b.rating??-1)-(a.rating??-1)||a.name.localeCompare(b.name,'de'));
    const g=$('#fgrid');
    if(!list.length){g.className='';g.innerHTML='<div class="empty">'+(F.items.length?'Keine Treffer.':'Noch keine Flaschen freigegeben.')+'</div>';return}
    g.className='grid';
    g.innerHTML=list.map((b,i)=>`<article class="card" data-i="${i}"><div class="pic">${b.image?`<img loading="lazy" src="${esc(b.image)}" alt="">`:PH()}<div class="gauge"><i style="height:${b.fill}%"></i></div>${b.rating!=null?`<b class="score">${b.rating}</b>`:''}</div><div class="cbody">${b.distillery?`<div class="dist">${esc(b.distillery)}</div>`:''}<h3>${esc(b.name)}</h3><p>${esc(meta(b))}</p><div class="cfoot"><span>${b.fill} % voll</span>${iHave(b)?'<span>hast du auch</span>':''}</div></div></article>`).join('');
    $$('.card',g).forEach(c=>c.onclick=()=>friendBottle(list[c.dataset.i],p.name));
  };
  $('#fq').oninput=e=>{F.q=e.target.value;fill()};
  $('#fnew').onchange=e=>{F.onlyNew=e.target.checked;fill()};
  fill();
}
function friendBottle(b,owner){
  const d=modal(`<div class="mhead"><h2>${esc(b.name)}</h2><button class="x" data-close aria-label="Schliessen">✕</button></div>
  <div class="imgrow"><div class="pic">${b.image?`<img src="${esc(b.image)}" alt="">`:PH('Foto')}<div class="gauge"><i style="height:${b.fill}%"></i></div></div><div class="stack"><span class="muted">${esc([b.distillery,b.age?b.age+' Jahre':'',b.abv?b.abv+' %':'',b.volume?b.volume+' ml':'',b.region,b.cask,b.bottler].filter(Boolean).join(' · '))}</span><span>Füllstand: <b>${b.fill} %</b></span><span>Note von ${esc(owner||'Freund')}: <b style="color:var(--copper2)">${b.rating??'–'}</b></span>${iHave(b)?'<span class="pill ja">hast du auch</span>':''}</div></div>
  ${b.notes?`<div class="box"><label style="margin:0">Notizen</label><div style="white-space:pre-wrap">${esc(b.notes)}</div></div>`:''}
  <div class="box"><label style="margin:0">Preis prüfen</label><div class="links">${priceLinks(b.name,b.barcode,b.distillery)}</div></div>
  ${iHave(b)?'':'<div><button class="btn" data-wish>Auf meine Wunschliste</button></div>'}`);
  $('[data-wish]',d)?.addEventListener('click',()=>{
    if(D.wishlist.some(x=>(b.barcode&&x.barcode===b.barcode)||x.name.trim().toLowerCase()===b.name.trim().toLowerCase())){toast('Steht schon auf deiner Wunschliste');return}
    put('wishlist',{id:uid(),name:b.name,distillery:b.distillery||'',barcode:b.barcode||'',image:b.image||'',note:'Gesehen bei '+(owner||'einem Freund'),target:null,seen:null,prio:'normal',added:Date.now()});toast('Auf deiner Wunschliste');d.close();
  });
}

/* ============ Konto ============ */
function rAccount(v){
  const prov=ME.providerData.map(p=>p.providerId==='google.com'?'Google':'E-Mail').join(', ');
  v.innerHTML=`<div class="list" style="max-width:640px">
  <div class="box"><label style="margin:0">Angemeldet als</label><div><b>${esc(PROFILE?.name||ME.displayName||'')}</b><div class="muted sm">${esc(ME.email||'')} · ${esc(prov)}</div></div>${!ME.emailVerified&&ME.providerData.some(p=>p.providerId==='password')?'<p class="sm muted" style="margin:0">E-Mail noch nicht bestätigt (Link in deinem Postfach).</p>':''}<div><button class="btn" id="out">Abmelden</button></div></div>
  ${LEGACY?`<div class="banner"><b>Lokale Daten gefunden</b><p class="sm muted" style="margin:4px 0 10px">Auf diesem Gerät liegen ${LEGACY.bottles.length} Flaschen aus der alten Version ohne Konto. Sie lassen sich in dein Konto übernehmen.</p><button class="btn pri" id="legacy">In mein Konto übernehmen</button></div>`:''}
  <div class="box"><label style="margin:0">Währung</label><select id="cur">${['CHF','EUR','USD','GBP'].map(c=>`<option ${c===D.settings.currency?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="box"><label style="margin:0">Backup</label><p class="sm muted" style="margin:0">Deine Daten liegen in deinem Konto in der Cloud. Ein zusätzliches Backup als Datei ist trotzdem sinnvoll.</p>
    <div class="row wrap"><button class="btn pri" id="exp">Backup exportieren (JSON)</button><button class="btn" id="imp">Backup importieren</button><button class="btn" id="csv">Sammlung als CSV</button><input type="file" id="impf" accept="application/json" hidden></div></div>
  <div class="box"><label style="margin:0">Version</label><div>Whisky Vault ${APP_VERSION}</div><div><button class="btn" id="clog">Änderungsprotokoll anzeigen</button></div></div>
  <div class="box"><label style="margin:0">Quellen</label><p class="sm muted" style="margin:0">Produktdaten und Bilder: Open Food Facts, UPCitemdb und Wikidata (nicht jede Flasche ist vorhanden). Preise: Open Prices (Community-Meldungen) und Vergleichslinks zu Preisportalen.</p></div>
  <div class="box"><button class="btn danger" id="wipe">Alle meine Whisky-Daten löschen</button></div></div>`;
  $('#out').onclick=()=>signOut(auth);
  $('#clog').onclick=()=>showChangelog(CHANGELOG);
  $('#cur').onchange=e=>{D.settings.currency=e.target.value;saveSettings();render()};
  $('#exp').onclick=()=>dl(`whisky-vault-${today()}.json`,JSON.stringify({bottles:D.bottles,sessions:D.sessions,tastings:D.tastings,wishlist:D.wishlist,settings:D.settings}),'application/json');
  $('#imp').onclick=()=>$('#impf').click();
  $('#impf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.bottles))throw 0;if(!confirm(`${j.bottles.length} Flaschen aus dem Backup zu deinen Daten hinzufügen? Gleiche IDs werden überschrieben.`))return;await bulkSet(j);toast('Backup importiert')}catch(err){alert('Datei ist kein gültiges Backup oder Import fehlgeschlagen.')}};
  if(LEGACY)$('#legacy').onclick=async()=>{try{await bulkSet(structuredClone(LEGACY));LEGACY=null;toast('Lokale Daten übernommen');render()}catch(e){fail(e)}};
  $('#csv').onclick=()=>{const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;const rows=[['Name','Brennerei','Alter','Alkohol','Inhalt ml','Barcode','Fuellstand %','Einstand','Note','Marktpreis','Notizen','Region','Fassart','Abfueller','Kaufdatum','Kaufort','Status'],...D.bottles.map(b=>[b.name,b.distillery,b.age,b.abv,b.volume,b.barcode,b.fill,b.price,b.rating,b.market?.price,b.notes,b.region,b.cask,b.bottler,b.bought,b.shop,isOpen(b)?'geöffnet':'ungeöffnet'])];dl('whisky-sammlung.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n'),'text/csv')};
  $('#wipe').onclick=async()=>{if(confirm('Wirklich ALLE deine Flaschen, Degustationen und Bewertungen löschen? Das lässt sich nicht rückgängig machen.')){try{await wipeAll();toast('Alles gelöscht')}catch(e){fail(e)}}};
}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ============ Start ============ */
addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('.card[tabindex],.item[tabindex],.lrow[tabindex]')){e.preventDefault();e.target.click()}});
function render(){
  const v=$('#view');
  if(!ME){return renderAuth()}
  v.onclick=null;v.onkeydown=null;
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  $('#frdot').hidden=!FR.incoming.length;
  if(UI.loading){v.innerHTML='<p class="muted">Lade deine Sammlung …</p>';return}
  ({sammlung:rColl,degustation:rTast,kaufliste:rBuy,freunde:rFriends,konto:rAccount})[UI.tab](v);
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(UI.tab!==b.dataset.tab)UI.friend=null;UI.tab=b.dataset.tab;render();scrollTo(0,0)}});

if(!CONFIGURED){$('#tabs').hidden=true;renderAuth()}
else onAuthStateChanged(auth,async u=>{
  stopListeners();ME=u;PROFILE=null;D=blankD();FR=blankFR();UI.friend=null;UI.loading=true;LEGACY=null;
  $('#tabs').hidden=!u;
  $('#chip').textContent=u?(u.displayName||u.email||''):'';
  if(!u){renderAuth();return}
  render();
  setTimeout(maybeChangelog,600);
  await ensureProfile();
  startListeners();
  checkJoin();
  try{const l=await LocalDB.get('data');if(l&&Array.isArray(l.bottles)&&l.bottles.length){LEGACY=l;toast('Lokale Daten der alten Version gefunden – siehe Tab «Konto».')}}catch{}
});
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
